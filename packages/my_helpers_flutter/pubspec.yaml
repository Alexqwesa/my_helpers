name: my_helpers_flutter
description: Flutter UI helpers built on my_helpers_dart.
publish_to: none
version: 1.0.1+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  my_helpers_dart:
    path: ../my_helpers_dart
  animated_toggle_switch:
  crypto: ^3.0.7
  diacritic: ^0.1.6
  flutter_hooks: ^0.21.3+1
  gap: ^3.0.1
  pluto_grid: ^8.1.0
  flutter_riverpod: ^2.6.1
  get_it:
  go_router:
  intl:
  locale_switcher:
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  shared_preferences:
  timezone: ^0.10.1
  toggle_switch: any
  url_strategy:

dev_dependencies:
  build_runner:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
